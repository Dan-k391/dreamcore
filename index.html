<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { Water } from 'three/addons/objects/Water2.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// Anything outside a light's shadow frustum counts as shadowed instead of lit. The sun's shadow map then only has to
// cover the one hall it shines into; every enclosed zone is dark to it for free.
THREE.ShaderChunk.shadowmap_pars_fragment = THREE.ShaderChunk.shadowmap_pars_fragment.replace('float shadow = 1.0;', 'float shadow = 0.0;');

const renderer = new THREE.WebGLRenderer({ powerPreference: 'high-performance' });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false; // static level: a shadow map is re-rendered only when its light moves
document.body.append(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(72, 1, .08, 5000);
const spawn = location.hash.slice(1).split(',').map(Number), spawned = spawn.length > 1 && spawn.every(isFinite); // optional #x,z,yaw,pitch: start anywhere (used for stage photos)
camera.position.set(spawned ? spawn[0] : 1.9, 1.62, spawned ? spawn[1] : 20);
if (spawned) camera.rotation.set(spawn[3] || 0, spawn[2] || 0, 0, 'YXZ');
const uTime = { value: 0 }, V = (x, y, z) => new THREE.Vector3(x, y, z);
const quadVS = 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }';
const H = 2.7, PH = 5, WY = -0.12; // backrooms ceiling, pool hall ceiling, water level (shared by every pool)

// ---------- zones: each has its own materials, ambient probe, exposure, fog, grade and room tone ----------
const warm = { grp: 'b', k: 1.2, exp: .36, fog: [.55, .45, .2, .002], tint: [1.02, 1, .96], sat: 1, bloom: .3, shaft: 0, hum: 1, water: 0, wet: .15 };
const dark = { grp: 'd', k: .6, fog: [.006, .02, .018, .004], tint: [1, 1, .98], sat: 1, shaft: 0, hum: 0, water: 1, band: 1.15, bandCol: [.05, .3, .28] };
const zones = {
  bA: { ...warm, box: [-9.4, 0, 9.4, 21.4], probe: [0, 1.5, 11] },
  bB: { ...warm, box: [-33.4, .6, -9.4, 21.4], probe: [-21.3, 1.7, 13] },
  bC: { ...warm, box: [9.4, .4, 36.8, 12.4], probe: [23.4, 1.5, 10.8], wet: .3 },
  pH: { grp: 'h', k: 1.25, exp: .34, fog: [.7, .82, .95, .0015], tint: [1, 1, 1.02], sat: 1.08, bloom: .35, shaft: 1, hum: 0, water: 1, wet: .5,
        box: [-9.4, -23.4, 9.4, 0], probe: [.5, 2.2, -12.5], env: [[-9, -1.4, -23], [9, 5, -1]], band: -99, bandCol: [1, 1, 1], shimmer: .25 },
  pC: { ...dark, exp: .26, bloom: .3, wet: .6, box: [9.4, -14.8, 21, -9.2], probe: [15.2, 1.6, -12], env: [[9.4, -.3, -14.8], [21, 3.6, -9.2]], shimmer: .35 },
  pN: { ...dark, exp: .22, bloom: .34, wet: .8, box: [21, -24.4, 45.4, .4], probe: [33, 3, -12], env: [[21, -1.4, -24.4], [45, 7, .4]], shimmer: .25 },
};
for (const [id, z] of Object.entries(zones)) Object.assign(z, { id, fog: new THREE.Vector4(...z.fog), tint: V(...z.tint), probe: V(...z.probe) });

// ---------- procedural textures (albedo + normal + roughness from one function) ----------
const hash = (x, y) => { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const noise = (x, y, p) => { // tileable value noise, integer period p
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy), w = (i, j) => hash(i % p, j % p);
  return (w(xi, yi) * (1 - sx) + w(xi + 1, yi) * sx) * (1 - sy) + (w(xi, yi + 1) * (1 - sx) + w(xi + 1, yi + 1) * sx) * sy;
};
const fbm = (u, v, p, o) => { let a = 0, k = .5; for (let i = 0; i < o; i++, p *= 2, k *= .5) a += k * noise(u * p, v * p, p); return a; };
const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const maxA = renderer.capabilities.getMaxAnisotropy();

// fn(u, v, px, py) -> [r, g, b, height, roughness]; texture covers `meters` of world space
function makeTex(n, meters, fn, bump = 1) {
  const col = new Uint8ClampedArray(n * n * 4), rgh = new Uint8ClampedArray(n * n * 4), nor = new Uint8ClampedArray(n * n * 4), hgt = new Float32Array(n * n);
  for (let y = 0, i = 0; y < n; y++) for (let x = 0; x < n; x++, i++) {
    const [r, g, b, h, ro] = fn(x / n, y / n, x, y);
    col.set([r * 255, g * 255, b * 255, 255], i * 4); rgh.set([ro * 255, ro * 255, ro * 255, 255], i * 4); hgt[i] = h;
  }
  for (let y = 0, i = 0; y < n; y++) for (let x = 0; x < n; x++, i++) {
    const dx = (hgt[y * n + (x + 1) % n] - hgt[y * n + (x + n - 1) % n]) * bump, dy = (hgt[((y + 1) % n) * n + x] - hgt[((y + n - 1) % n) * n + x]) * bump, l = 127.5 / Math.hypot(dx, dy, 1);
    nor.set([127.5 - dx * l, 127.5 - dy * l, 127.5 + l, 255], i * 4);
  }
  const T = (d, srgb) => {
    const t = new THREE.DataTexture(new Uint8Array(d.buffer), n, n);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.setScalar(1 / meters);
    t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter; t.generateMipmaps = true; t.anisotropy = maxA;
    if (srgb) t.colorSpace = THREE.SRGBColorSpace;

const tileTex = makeTex(1024, 1, (u, v) => { // 10cm glazed tiles, each slightly tilted so reflections break up per tile
  const tu = u * 10 % 1, tv = v * 10 % 1, iu = Math.floor(u * 10), iv = Math.floor(v * 10);
  const g = ss(.015, .045, Math.min(tu, 1 - tu, tv, 1 - tv)), n = noise(u * 80, v * 80, 80), c = .58 + g * (.33 + .05 * hash(iu, iv));
  return [c * .975, c, c * .995, g + ((tu - .5) * (hash(iu + 31, iv) - .5) + (tv - .5) * (hash(iu, iv + 57) - .5)) * 1.5 + n * .015, .8 - g * (.72 - .1 * n)];
}, 1.5);
const carpetTex = makeTex(512, 1.5, (u, v, x, y) => {
  const f = hash(x, y), s = noise(u * 128, v * 128, 128), k = .62 + .3 * f * s + .2 * s + .25 * fbm(u, v, 4, 3);
  return [.66 * k, .58 * k, .37 * k, f * .5 + s, 1];
}, 1.2);
const paperTex = makeTex(1024, 1.2, (u, v) => { // mustard wallpaper: pinstripes + staggered embossed diamonds
  const cu = u * 8 % 1, cv = (v * 8 + (Math.floor(u * 8) & 1) * .5) % 1;
  const line = Math.abs(cu - .5) > .47 ? 1 : 0, motif = Math.abs(cu - .5) * 1.5 + Math.abs(cv - .5) < .13 ? 1 : 0;
  const fib = noise(u * 300, v * 300, 300), k = (.9 + .1 * fib) * (1 - .1 * line - .08 * motif) * (.9 + .15 * fbm(u, v, 3, 4));
  return [.93 * k, .83 * k, .46 * k, fib * .25 - line * .4 + motif * .4, .9];
}, 1.5);
const ceilTex = makeTex(1024, 1.2, (u, v, x, y) => { // 60cm acoustic tiles in a T-bar grid
  const tu = u * 2 % 1, tv = v * 2 % 1, e = Math.min(tu, 1 - tu, tv, 1 - tv), bar = e < .02;
  const pit = Math.min(1, Math.pow(noise(u * 160, v * 160, 160), 7) * 5 + (hash(x, y) > .994 ? .8 : 0));
  const c = bar ? .9 : (.84 + .05 * hash(Math.floor(u * 2), Math.floor(v * 2) + 5)) * (1 - .16 * pit) * (.92 + .1 * fbm(u, v, 4, 3));
  return [c, c * .985, c * .94, bar ? 1.6 : 1 - pit * .8 - (e < .03 ? .4 : 0), .95];
}, 2);
const lampTex = makeTex(256, .6, (u, v) => { // prismatic diffuser with two tubes glowing behind it
  const c = (.5 + .5 * (Math.exp(-(((u - .28) / .11) ** 2)) + Math.exp(-(((u - .72) / .11) ** 2)))) * (.93 + .07 * Math.sin(u * 251.3) * Math.sin(v * 251.3));
  return [c, c * .97, c * .88, 0, .3];
});
const grime = makeTex(256, 9, (u, v) => [0, 0, 0, 0, .5 + .8 * fbm(u, v, 3, 5)]).roughnessMap; // large-scale mottling, breaks up tiling
const waves = s => { // tileable ripple heightfield -> water normal map
  const w = []; for (let i = 0; i < 14; i++) w.push([Math.round(hash(i, s) * 12 - 6) || 1, Math.round(hash(i, s + 9) * 12 - 6), hash(i, s + 5) * 6.28]);
  return (u, v) => { let h = 0; for (const [a, b, p] of w) h += Math.sin(6.2832 * (a * u + b * v) + p) / Math.hypot(a, b); return [0, 0, 0, h, 0]; };
};
const wn0 = makeTex(512, 6, waves(1), 2).normalMap, wn1 = makeTex(512, 6, waves(2), 2).normalMap;

// ---------- materials ----------
// Budget: 16 texture units. 9 lamp shadows + 1 sun shadow leave 6: tiles use 5 (3 maps, env, ripple sim), nothing else may use more.
const S = o => new THREE.MeshStandardMaterial(o);
const dirt = { aoMap: grime, aoMapIntensity: .7 };
for (const z of [zones.bA, zones.bB, zones.bC]) {
  z.carpet = S({ map: carpetTex.map, normalMap: carpetTex.normalMap, ...dirt });
  z.paper = S({ map: paperTex.map, normalMap: paperTex.normalMap, roughness: .88, ...dirt });
  z.ceil = S({ map: ceilTex.map, normalMap: ceilTex.normalMap, roughness: .95, ...dirt });
  z.trim = S({ color: 0xcfc59a, roughness: .55 });
  z.mats = [z.carpet, z.paper, z.ceil, z.trim];
}
const lampOn = S({ color: 0x111111, emissive: 0xfff0cf, emissiveMap: lampTex.map, emissiveIntensity: 9 });
const lampOff = S({ map: lampTex.map, color: 0x9a9a90, roughness: .35 });
const glow = S({ color: 0, emissive: 0xffedc0, emissiveIntensity: 14 }); // frosted windows and light wells
const chrome = S({ metalness: 1, roughness: .1 });
const slideMat = S({ color: 0x0b4f4c, roughness: .16, side: THREE.DoubleSide });
const seaMat = S({ color: 0x0f4652, roughness: .05, normalMap: wn0, normalScale: new THREE.Vector2(.5, .5) });
zones.bA.mats.push(lampOff);

// Tile shader extras: caustics under water, rippling reflected light on walls above it, a coloured tile band below a
// given height, and box-projected reflections so glossy tiles mirror the room's windows in the right place.
function tileFX(m, z) {
  const u = z.tileU = { uTime, uBand: { value: z.band }, uBandCol: { value: new THREE.Color(...z.bandCol) }, uShimmer: { value: z.shimmer },
              uBoxMin: { value: V(...z.env[0]) }, uBoxMax: { value: V(...z.env[1]) }, uProbe: { value: z.probe },
              uSim: { value: null }, uPond: { value: new THREE.Vector4(0, 0, 1, 1) }, uPx: { value: new THREE.Vector2() } }; // this zone's pool, filled in when the pool is made
  m.onBeforeCompile = s => {
    Object.assign(s.uniforms, u);
    s.vertexShader = 'varying vec3 vW;\n' + s.vertexShader.replace('#include <project_vertex>', '#include <project_vertex>\nvW = (modelMatrix * vec4(transformed, 1.)).xyz;');
    s.fragmentShader = `varying vec3 vW; uniform float uTime, uBand, uShimmer; uniform vec3 uBandCol, uBoxMin, uBoxMax, uProbe; uniform sampler2D uSim; uniform vec4 uPond; uniform vec2 uPx;
      vec2 h2(vec2 p) { return fract(sin(vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)))) * 43758.5453); }
      float cell(vec2 p, float t) { vec2 i = floor(p), f = fract(p); float a = 8., b = 8.;
        for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) { vec2 g = vec2(x, y); float d = length(g + .5 + .42 * sin(t + 6.2831 * h2(i + g)) - f); if (d < a) { b = a; a = d; } else b = min(b, d); }
        return b - a; }
      float caus(vec3 w) { vec2 p = w.xz * 1.5 + w.y * .9; p += .3 * sin(p.yx * 1.3 + uTime * .6) + .14 * sin(p.yx * 3.3 - uTime * .9); // warped so the cells don't read as straight-edged polygons
        return pow(1. - smoothstep(0., .5, min(cell(p, uTime * .8), cell(p * 1.63 + 7.3, uTime * 1.1))), 3.); }
      vec3 boxProj(vec3 d) { vec3 m = max((uBoxMax - vW) / d, (uBoxMin - vW) / d); return vW + d * min(min(m.x, m.y), m.z) - uProbe; }
    ` + s.fragmentShader
      .replace('#include <envmap_physical_pars_fragment>', THREE.ShaderChunk.envmap_physical_pars_fragment.replace(
        'reflectVec = inverseTransformDirection( reflectVec, viewMatrix );', 'reflectVec = boxProj( inverseTransformDirection( reflectVec, viewMatrix ) );'))
      .replace('#include <color_fragment>', '#include <color_fragment>\nif (vW.y < uBand) diffuseColor.rgb *= uBandCol;')
      .replace('#include <lights_fragment_end>', `#include <lights_fragment_end>
        if (vW.y < ${WY}) { // light focused by the surface: a drifting base pattern plus the real ripples (crests focus, troughs spread)
          vec2 s = (vW.xz - uPond.xy) / (uPond.zw - uPond.xy), o = uPx * 2.;
          float lap = texture2D(uSim, s - vec2(o.x, 0.)).r + texture2D(uSim, s + vec2(o.x, 0.)).r + texture2D(uSim, s - vec2(0., o.y)).r + texture2D(uSim, s + vec2(0., o.y)).r - 4. * texture2D(uSim, s).r;
          float c = max(caus(vW) + clamp(-lap * 30., -.6, 2.5), 0.) * smoothstep(${WY}, ${WY} - .3, vW.y);
          reflectedLight.directDiffuse *= 1. + 3. * c; reflectedLight.indirectDiffuse *= 1. + 1.2 * c; }
        else if (uShimmer > 0.) reflectedLight.indirectDiffuse *= 1. + uShimmer * caus(vW * .6) * smoothstep(.2, 1.2, vW.y - ${WY}) * exp((${WY} - vW.y) * .3);`);
  };
  return m;
}
for (const z of [zones.pH, zones.pC, zones.pN]) { z.tile = tileFX(S({ ...tileTex }), z); z.mats = [z.tile]; }
zones.pH.mats.push(chrome); zones.pN.mats.push(slideMat);

// ---------- level builder: boxes and cut-out wall slabs with world-space UVs, merged into one mesh per material ----------
const colliders = [], geo = new Map(), noCast = new Set([lampOn, glow, seaMat]), emitters = [];
function add(mat, g) {
  g = g.index ? g.toNonIndexed() : g;
  const p = g.attributes.position, n = g.attributes.normal, uv = g.attributes.uv;
  for (let i = 0; i < p.count; i++) {
    if (Math.abs(n.getY(i)) > .5) uv.setXY(i, p.getX(i), p.getZ(i));
    else if (Math.abs(n.getX(i)) > .5) uv.setXY(i, p.getZ(i), p.getY(i));
    else uv.setXY(i, p.getX(i), p.getY(i));

}
function box(mat, x1, y1, z1, x2, y2, z2) {
  add(mat, new THREE.BoxGeometry(x2 - x1, y2 - y1, z2 - z1).translate((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2));
  if (y1 < 1.7 && y2 > .3) colliders.push([x1, z1, x2, z2]); // anything at body height blocks the player
}
// Wall slab with shapes cut out of it. axis 'x': runs a1..a2 along x, occupying z = at..at+depth; axis 'z': the same along z.
// cuts: ['arch', centre, width, top] (niche rising from the floor), ['pill', centre, width, y, height], ['round', centre, diameter, y]
function slab(mat, axis, at, depth, a1, a2, y1, y2, cuts) {
  const sh = new THREE.Shape().moveTo(a1, y1).lineTo(a1, y2).lineTo(a2, y2).lineTo(a2, y1);
  for (const [, c, w, top] of cuts.filter(c => c[0] === 'arch').sort((p, q) => q[1] - p[1]))
    sh.lineTo(c + w / 2, y1).lineTo(c + w / 2, top - w / 2).absarc(c, top - w / 2, w / 2, 0, Math.PI, false).lineTo(c - w / 2, y1);
  sh.closePath();
  for (const [kind, c, w, y, h] of cuts) if (kind !== 'arch') {
    const p = new THREE.Path();

const room = (z, x1, z1, x2, z2, h) => { box(z.carpet, x1, -.2, z1, x2, 0, z2); box(z.ceil, x1, h, z1, x2, h + .2, z2); };

  box(on ? lampOn : lampOff, x - .3, h - .012, zc - .6, x + .3, h + .01, zc + .6);

{ // backrooms A: the first maze. x[-9,9] z[1,21]
  const z = zones.bA;
  room(z, -9.4, 0, 9.4, 21.4, H);
  box(z.paper, -1.2, 2.2, 0, 1.2, H, 1); box(z.paper, -9.42, 2.3, 3, -9, 3.3, 6); box(z.paper, 9, 2.3, 9.6, 9.4, H, 12); // lintels: pools, pillar hall, corridor
  for (const w of [
    [-9.42, 1, -9, 3, 3.3], [-9.42, 6, -9, 21.4, 3.3], [9, 1, 9.4, 9.6], [9, 12, 9.4, 21.4], [-9.4, 21, 9.4, 21.4], [-9.4, 0, -1.2, 1], [1.2, 0, 9.4, 1], // outer walls
    [-9, 7, -4, 7.3], [-1.5, 7, 4, 7.3], [6.5, 7, 9, 7.3], [-3.3, 10, -3, 16], [3, 7.3, 3.3, 13], [5, 14, 9, 14.3],
    [-9, 16, -5.5, 16.3], [-3.3, 16, .5, 16.3], [.5, 16, .8, 18.5], [-6.3, 10.7, -5.7, 11.3], [6.2, 19.2, 6.8, 19.8],
  ]) wall(z, ...w);
  for (const [x, zc] of [[-5.7, 3.6], [.3, 4.2], [5.7, 3.6], [.3, 10.2], [.3, 14.4], [-6.3, 12.6], [6.3, 17.4], [-1.5, 19.2], [-6.3, 18.6]]) lamp(z, x, zc);
  lamp(z, 6.3, 10.2, H, false); // one dead panel: the east room is lit only by spill
}
{ // backrooms B: a taller pillar hall to the west. x[-33,-9.4] z[1,21]
  const z = zones.bB, h = 3.3;

// ---------- audio: generative ambient music, room tone and footsteps, all synthesised ----------
let sfx;

  const ir = ac.createBuffer(2, ac.sampleRate * 5, ac.sampleRate), noise = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); // hall reverb impulse, white noise

  for (let d = noise.getChannelData(0), i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  const wow = bus(7); { const o = ac.createOscillator(); o.frequency.value = .11; o.connect(wow); o.start(); } // tape wobble, in cents

    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + att); g.gain.setTargetAtTime(0, t + att + hold, rel);

  const music = bus(1.2, master, verb), pad = ac.createBiquadFilter(), echo = ac.createDelay(2);
  pad.frequency.value = 850; pad.Q.value = .4; pad.connect(music); lfo(.04, 300, pad.frequency);
  echo.delayTime.value = .52; echo.connect(bus(.45, echo)); echo.connect(music);

  const chords = [[38, 50, 57, 61, 64, 66], [35, 47, 54, 57, 61, 62], [31, 43, 50, 54, 57, 59], [33, 45, 52, 57, 59, 64]]; // Dmaj9, Bm9, Gmaj7, A6sus

    for (let t = next + Math.random() * 2; t < next + 10; t += 1.3 + Math.random() * 3.5) {

  sfx = {
    step(kind) { // a short filtered noise burst per footfall

// ---------- walking ----------
const canvas = renderer.domElement, o = document.getElementById('o'), keys = {}, eu = new THREE.Euler(0, 0, 0, 'YXZ');
const locked = () => document.pointerLockElement === canvas;
let free = false; // free: capture was refused, so the bare cursor steers. Nothing turns the view except the mouse moving or a turn key.
const noLock = () => { free = true; canvas.style.cursor = 'none'; document.getElementById('x').hidden = false; document.getElementById('h').hidden = false; };
const turn = (dx, dy) => { eu.setFromQuaternion(camera.quaternion); eu.y -= dx; eu.x = Math.max(-1.5, Math.min(1.5, eu.x - dy)); camera.quaternion.setFromEuler(eu); };
// Raw (unadjusted) movement avoids the random jumps Windows cursor acceleration and display scaling cause under capture.
const capture = () => canvas.requestPointerLock({ unadjustedMovement: true })?.catch(e => e.name === 'NotSupportedError' ? canvas.requestPointerLock()?.catch(noLock) : noLock());
o.onclick = () => { o.style.display = 'none'; sfx || startAudio(); capture(); };
document.addEventListener('pointerlockerror', noLock);
document.addEventListener('pointerlockchange', () => { if (!locked()) o.style.display = ''; }); // Esc pauses
addEventListener('mousemove', e => { // mouse look: captured pointer where the browser allows it, bare cursor movement where it doesn't
  if (!locked() && !free) return;
  const m = free ? 60 : 250, cl = v => Math.max(-m, Math.min(m, v)); // drop the one-event jumps browsers report on re-entry or under capture
  turn(cl(e.movementX) * .0022, cl(e.movementY) * .0022);

addEventListener('keydown', e => { keys[e.code] = 1; if (e.code === 'Space') e.preventDefault(); if (e.code === 'KeyM') sfx?.mute(); });
addEventListener('keyup', e => keys[e.code] = 0);
document.getElementById('s').textContent = 'click to enter  ·  wasd walk  ·  mouse look  ·  q / e turn  ·  space jump  ·  shift run  ·  m mute';

function collide(p, R = .3) { // push the player circle out of every wall box along the shallowest axis
  for (const [x1, z1, x2, z2] of colliders) if (p.x > x1 - R && p.x < x2 + R && p.z > z1 - R && p.z < z2 + R) {
    const dx = p.x - (x1 - R) < x2 + R - p.x ? x1 - R - p.x : x2 + R - p.x, dz = p.z - (z1 - R) < z2 + R - p.z ? z1 - R - p.z : z2 + R - p.z;

}
console.assert(floorH(0, -12) === -1.2 && floorH(0, -6.2) === -.3 && floorH(15, -12) === -.3 && floorH(24.2, -12) === -.6 && floorH(30, -12) === -1.2 && floorH(0, 10) === 0
  && collide(V(5, 0, .6)).z > 1.29 && Object.values(zones).every(z => inR(z.probe.x, z.probe.z, ...z.box)) && emitters.every(e => inR(e.p.x, e.p.z, ...e.zone.box)), 'level self-check failed');

const clock = new THREE.Clock(), vel = new THREE.Vector2(), UP = new THREE.Vector3(0, 1, 0);

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05), p = camera.position, k = c => keys[c] ? 1 : 0, ease = Math.min(1, dt * 8);
  uTime.value += dt;
